
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Kids Cartoon Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }
    main { max-width: 850px; margin: auto; }
    h1 { color: #fde68a; text-align: center; }
    .panel {
      background: #ffffff12;
      border: 1px solid #ffffff30;
      border-radius: 18px;
      padding: 20px;
      margin: 18px 0;
    }
    label { display: block; margin: 12px 0 6px; }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 0;
      font-size: 16px;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      background: #facc15;
      color: #1f2937;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }
    .scene {
      min-height: 220px;
      border-radius: 15px;
      background: linear-gradient(#7dd3fc, #c4b5fd);
      display: grid;
      place-items: center;
      text-align: center;
      color: #1f2937;
      padding: 20px;
      font-size: 20px;
    }
    .rabbit { font-size: 76px; }
    small { color: #d1d5db; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>🌈 AI Kids Cartoon Studio</h1>
    <p style="text-align:center">अपनी बच्चों की कहानी और कार्टून सीन बनाओ!</p>

    <section class="panel">
      <h2>🎬 कहानी बनाओ</h2>
      <label for="story">अपनी कहानी का आइडिया लिखो</label>
      <textarea id="story" placeholder="जैसे: एक प्यारा खरगोश जंगल में दोस्त बनाता है..."></textarea>

      <label for="character">कैरेक्टर चुनो</label>
      <select id="character">
        <option value="🐰">खरगोश</option>
        <option value="🐻">भालू</option>
        <option value="🦊">लोमड़ी</option>
        <option value="🐼">पांडा</option>
        <option value="🐱">बिल्ली</option>
      </select>

      <button onclick="makeScene()">कार्टून सीन बनाओ</button>
      <button onclick="speakStory()">🔊 कहानी सुनो</button>
    </section>

    <section class="panel">
      <h2>✨ तुम्हारा सीन</h2>
      <div class="scene">
        <div>
          <div class="rabbit" id="animal">🐰</div>
          <div id="sceneText">तुम्हारी कहानी यहाँ दिखाई देगी!</div>
        </div>
      </div>
      <small>
        नोट: यह शुरुआती वेबसाइट प्रोटोटाइप है। अभी यह असली AI वीडियो नहीं बनाती।
        आगे चलकर इसमें AI मॉडल जोड़ने की कोशिश करेंगे।
      </small>
    </section>
  </main>

  <script>
    function makeScene() {
      const story = document.getElementById("story").value.trim();
      const character = document.getElementById("character").value;

      document.getElementById("animal").textContent = character;
      document.getElementById("sceneText").textContent =
        story || "एक प्यारा कार्टून कैरेक्टर अपनी मजेदार कहानी शुरू करता है!";
    }

    function speakStory() {
      const story = document.getElementById("story").value.trim()
        || "एक प्यारा कार्टून कैरेक्टर अपनी मजेदार कहानी शुरू करता है।";

      if (!("speechSynthesis" in window)) {
        alert("इस ब्राउज़र में कहानी सुनाने की सुविधा उपलब्ध नहीं है।");
        return;
      }

      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(story);
      speech.lang = "hi-IN";
      window.speechSynthesis.speak(speech);
    }
  </script>
</body>
</html>
